body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}

body.phone{--w:520px}body.tablet{--w:780px}body.web{--w:1100px}
body.phone header nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);max-width:none;padding-bottom:env(safe-area-inset-bottom)}

header{backdrop-filter:none}
h1{font-size:21px;margin:4px 0 12px}h2{font-size:16px;margin:18px 0 8px}

.grid .card{margin:0}

label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:19px}

.check{display:flex;gap:12px;align-items:flex-start;color:var(--ink);font-size:16px;margin:0;padding:11px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.check input{flex:none;margin:0;accent-color:#1c7368}.check .txt{flex:1;min-width:0}.check input:checked+.txt{color:var(--mute);text-decoration:line-through}
.progress{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2a9d8f,#52c2b2)}
.rate{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin-bottom:8px;align-items:center}
dialog{background:#fffdf9;border-top:6px solid var(--acc)}
#toast{background:var(--indigo)}
body.phone .pill:not(.warn){display:none}body.phone .brand{font-size:18px}

/* ---------- bolder headings ---------- */
h1{font-size:30px;font-weight:900;letter-spacing:.3px;margin:6px 0 14px;display:inline-block;padding:0 6px 2px 2px;background:linear-gradient(transparent 62%,#f9cdd6 62%)}
h2{font-size:18px;font-weight:800}
header nav button{font-weight:700;font-size:15px;letter-spacing:.2px}
header nav button.on{background:#ffffff22;border-radius:10px 10px 0 0}
body.phone header nav button{font-weight:700;font-size:13px}
body.phone header nav button.on{background:#fde7ea;border-radius:0 0 10px 10px}
/* ---------- paper colours ---------- */
.sw{display:inline-block;width:16px;height:16px;border-radius:3px;border:1px solid #0003;vertical-align:-3px;flex:none}
.sw.multi{background:conic-gradient(#d62f2a,#f6d13a,#3aa655,#6cb4e8,#8a63b8,#f49ac1,#d62f2a)}
.cols{display:inline-flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;color:var(--mute)}.cols span{display:inline-flex;gap:5px;align-items:center}
.colpick{display:flex;flex-wrap:wrap;gap:6px}
.colpick button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;padding:6px 10px;min-height:38px;border:2px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;color:var(--ink)}
.colpick button.on{border-color:var(--indigo);background:#e8ecf8;font-weight:700}
.colpick button.on::before{content:"✓";color:var(--indigo)}
.colrow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.colrow input[type=color]{height:44px;padding:3px;cursor:pointer}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{flex:1;font:inherit;font-weight:700;padding:10px;border:2px solid var(--indigo);background:#fff;color:var(--indigo);border-radius:5px 14px 5px 14px;cursor:pointer}
.subtabs button.on{background:var(--indigo);color:#fff}
.txt .cols,td .cols{display:flex;margin-top:3px}

/* ---------- solid selected tab ---------- */
header nav button.on{background:#c8362f;color:#fff!important;border-radius:10px 10px 0 0;border-bottom-color:#f4b942}
body.phone header nav button.on{background:#c8362f;color:#fff!important;border-radius:0 0 10px 10px;border-top-color:#7f1f1e}
/* ---------- paper photos ---------- */
.sw.img{background-size:cover!important;background-position:center!important}
.colrow{grid-template-columns:52px 1fr auto auto}
.colrow .swbox{width:52px;height:44px;border-radius:8px;border:1px solid #c9c5bc;background-size:cover;background-position:center;position:relative}
.colrow .swbox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.photobtn{position:relative;overflow:hidden}
.photobtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.colrow .sub{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.colpick .sw{width:22px;height:22px}
.colrow .photobtn{min-width:48px;min-height:44px;font-size:20px;justify-content:center;padding:4px 8px}
</style>
</head>
<body class="phone">
<header>
  <div class="bar">
    <div class="brand"><span class="logo"><svg viewBox="0 0 122 98" aria-hidden="true"><polygon points="58,64 90,14 84,66" fill="#f6a5b8" stroke="#f6a5b8" stroke-width=".6" stroke-linejoin="round"/><polygon points="72,64 118,26 90,76" fill="#2a9d8f" stroke="#2a9d8f" stroke-width=".6" stroke-linejoin="round"/><polygon points="72,64 118,26 82,60" fill="#52c2b2" stroke="#52c2b2" stroke-width=".6" stroke-linejoin="round"/><polygon points="48,66 20,24 34,74" fill="#3d5a99" stroke="#3d5a99" stroke-width=".6" stroke-linejoin="round"/><polygon points="48,66 20,24 40,60" fill="#5b7cc4" stroke="#5b7cc4" stroke-width=".6" stroke-linejoin="round"/><polygon points="20,24 4,40 25,32" fill="#f4b942" stroke="#f4b942" stroke-width=".6" stroke-linejoin="round"/><polygon points="34,74 60,58 90,76 60,92" fill="#c8362f" stroke="#c8362f" stroke-width=".6" stroke-linejoin="round"/><polygon points="34,74 60,70 60,92" fill="#a82a28" stroke="#a82a28" stroke-width=".6" stroke-linejoin="round"/><polygon points="40,68 46,6 62,70" fill="#ee5a46" stroke="#ee5a46" stroke-width=".6" stroke-linejoin="round"/><polygon points="46,6 78,72 62,70" fill="#f78d5c" stroke="#f78d5c" stroke-width=".6" stroke-linejoin="round"/></svg></span><span id="brandname"></span></div>
    <span class="pill" id="saved"></span>
    <button class="btn sm" data-act="note">✎ Note</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
"use strict";
const STATES=["New order","Accepted","In production","Ready for shipping","Shipped"];
const NEXT=["Accept order","Start production","Mark ready for shipping","Mark shipped"];
const CRANE='<svg viewBox="0 0 122 98" aria-hidden="true"><polygon points="58,64 90,14 84,66" fill="#f6a5b8" stroke="#f6a5b8" stroke-width=".6" stroke-linejoin="round"/><polygon points="72,64 118,26 90,76" fill="#2a9d8f" stroke="#2a9d8f" stroke-width=".6" stroke-linejoin="round"/><polygon points="72,64 118,26 82,60" fill="#52c2b2" stroke="#52c2b2" stroke-width=".6" stroke-linejoin="round"/><polygon points="48,66 20,24 34,74" fill="#3d5a99" stroke="#3d5a99" stroke-width=".6" stroke-linejoin="round"/><polygon points="48,66 20,24 40,60" fill="#5b7cc4" stroke="#5b7cc4" stroke-width=".6" stroke-linejoin="round"/><polygon points="20,24 4,40 25,32" fill="#f4b942" stroke="#f4b942" stroke-width=".6" stroke-linejoin="round"/><polygon points="34,74 60,58 90,76 60,92" fill="#c8362f" stroke="#c8362f" stroke-width=".6" stroke-linejoin="round"/><polygon points="34,74 60,70 60,92" fill="#a82a28" stroke="#a82a28" stroke-width=".6" stroke-linejoin="round"/><polygon points="40,68 46,6 62,70" fill="#ee5a46" stroke="#ee5a46" stroke-width=".6" stroke-linejoin="round"/><polygon points="46,6 78,72 62,70" fill="#f78d5c" stroke="#f78d5c" stroke-width=".6" stroke-linejoin="round"/></svg>';
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>"$"+(Math.round((+n||0)*100)/100).toFixed(2);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>n?String(n).padStart(4,"0"):"…";
const today=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const when=t=>new Date(t).toLocaleString("en-CA",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const day=s=>s?new Date(s+"T12:00").toLocaleDateString("en-CA",{month:"short",day:"numeric"}):"";
const cents=n=>Math.round((+n||0)*100);
const lineTotal=l=>cents(l.price)*(+l.qty||0)/100;
const subtotal=o=>o.lines.reduce((a,l)=>a+cents(lineTotal(l)),0)/100;
const total=o=>(cents(subtotal(o))+cents(o.shipping))/100;
const unpriced=o=>o.lines.some(l=>l.price===""||l.price==null);

/* ---------- packing checklist and shipping ---------- */
const PACK=[["env","Address written on envelope"],["ret","Return address written on envelope"],["stamp","Postage stamp attached"],["note","Thank you note put in envelope"]];
const checkKeys=o=>[...o.lines.map(l=>l.id),...PACK.map(p=>p[0])];
const left=o=>checkKeys(o).filter(k=>!o.checks[k]).length;
const defaultRates=()=>[{id:"canada",name:"Within Canada",price:3}];
const MULTI="Multi-colour";
const defaultColours=()=>[["Red","#d62f2a"],["Orange","#f28c28"],["Yellow","#f6d13a"],["Green","#3aa655"],["Teal","#2a9d8f"],["Light blue","#6cb4e8"],["Navy","#22366b"],["Purple","#8a63b8"],["Pink","#f49ac1"],["White","#ffffff"],["Black","#222222"],["Gold","#d4af37"],["Silver","#c0c0c0"]].map(([name,hex])=>({id:uid(),name,hex}));
const sw=n=>{if(n===MULTI)return '<i class="sw multi"></i>';const c=db.colours.find(x=>x.name===n);return c&&c.img?`<i class="sw img" style="background:url('${c.img}')"></i>`:`<i class="sw" style="background:${c?esc(c.hex):"repeating-linear-gradient(45deg,#ddd 0 3px,#fff 0 6px)"}"></i>`};
const colours=l=>(l.colours||[]).length?`<div class="cols">${l.colours.map(n=>`<span>${sw(n)}${esc(n)}</span>`).join("")}</div>`:"";
const colText=l=>(l.colours||[]).join(" + ");
const shipLabel=o=>o.shipName?"Shipping ("+o.shipName+")":"Shipping";
/* ---------- server sync ---------- */
const COLLS=["orders","products","notes"], DOCS=["settings","colours"];
let db=null, me=null, version="", status={}, admin=null, adminLoading=false;
let rev=0, base={}, sent={}, syncing=false, again=false, online=true, timer=0;
const K=(c,id)=>c+":"+id;
async function api(path,body,raw){
  const opt=body===undefined?{}:{method:"POST",headers:{"X-AO":"1","Content-Type":raw?"application/octet-stream":"application/json"},body:raw?body:JSON.stringify(body)};
  const r=await fetch(path,Object.assign({credentials:"same-origin"},opt));
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&me){location.reload();throw new Error("Please log in again.")}
  if(!r.ok)throw new Error(j.error||("Something went wrong ("+r.status+")."));
  return j;
}
const strip=r=>{const c=Object.assign({},r);delete c._rev;return c};
function adopt(c,rec){const k=K(c,rec.id),clean=strip(rec);base[k]=rec._rev;sent[k]=JSON.stringify(clean);return clean}
function loadAll(d){
  rev=d.rev;base={};sent={};db={};
  COLLS.forEach(c=>db[c]=d.records[c].map(r=>adopt(c,r)));
  DOCS.forEach(k=>{db[k]=d.docs[k].data;base[k]=d.docs[k].rev;sent[k]=JSON.stringify(d.docs[k].data)});
}
function replaceLocal(c,id,data){
  const i=db[c].findIndex(x=>x.id===id),k=K(c,id);
  if(!data){if(i>=0)db[c].splice(i,1);delete base[k];delete sent[k];return}
  const clean=adopt(c,data);
  if(i>=0){const r=db[c][i];Object.keys(r).forEach(x=>delete r[x]);Object.assign(r,clean)}else db[c].push(clean);
}
function pending(){
  if(!db)return [];
  const items=[];
  COLLS.forEach(c=>{
    const ids=new Set();
    db[c].forEach(r=>{ids.add(r.id);const j=JSON.stringify(r);if(sent[K(c,r.id)]!==j)items.push({coll:c,id:r.id,base:base[K(c,r.id)]||0,data:r,json:j})});
    Object.keys(sent).forEach(k=>{if(k.startsWith(c+":")){const id=k.slice(c.length+1);if(!ids.has(id))items.push({coll:c,id,base:base[k]||0,delete:true})}});
  });
  DOCS.forEach(k=>{if(k==="settings"&&me.role!=="admin")return;const j=JSON.stringify(db[k]);if(sent[k]!==j)items.push({coll:k,base:base[k],data:db[k],json:j})});
  return items;
}
const editing=()=>["new","edit","product"].includes(route.split("/")[0])||$("#dlg").open||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
const what=c=>({orders:"this order",products:"this product",notes:"this note",colours:"the paper colours",settings:"Settings"})[c];
function save(){clearTimeout(timer);timer=setTimeout(flush,400);pill()}
async function flush(){
  if(syncing){again=true;return}
  const items=pending();if(!items.length)return pill();
  syncing=true;pill();
  try{
    const res=await api("/api/save",{items:items.map(i=>({coll:i.coll,id:i.id,base:i.base,data:i.data,delete:i.delete}))});
    online=true;let redraw=false;
    res.results.forEach((r,i)=>{
      const it=items[i];
      if(DOCS.includes(it.coll)){
        const k=it.coll;
        if(r.ok){base[k]=r.rev;sent[k]=it.json}
        else if(r.conflict){base[k]=r.rev;sent[k]=JSON.stringify(r.data);db[k]=r.data;redraw=true;toast("Someone else changed "+what(k)+" at the same time. Showing their version, so please redo your change.")}
        else{toast(r.error||"Not saved.")}
        return;
      }
      const k=K(it.coll,it.id);
      if(r.ok&&r.deleted){delete base[k];delete sent[k];return}
      if(r.ok){
        const rec=db[it.coll].find(x=>x.id===it.id),clean=strip(r.data);base[k]=r.data._rev;
        if(rec){if(JSON.stringify(rec)===it.json){Object.keys(rec).forEach(x=>delete rec[x]);Object.assign(rec,clean)}else if(clean.number)rec.number=clean.number}
        sent[k]=JSON.stringify(clean);
        if(it.coll==="orders"&&!it.base)redraw=true;
        return;
      }
      replaceLocal(it.coll,it.id,r.data);redraw=true;
      toast(r.error||(r.data?"Someone else changed "+what(it.coll)+" at the same time. Showing their version, so please redo your change.":"Someone else deleted "+what(it.coll)+"."));
    });
    if(redraw&&!editing())render();
  }catch(e){online=false;setTimeout(flush,8000)}
  syncing=false;
  if(again){again=false;flush()}
  pill();
}
async function poll(){
  if(!me||document.hidden)return;
  try{
    const c=await api("/api/changes?since="+rev);online=true;status=c.status||status;
    if(c.reload){const d=await api("/api/data");loadAll(d);render();return}
    let redraw=false;
    c.changes.forEach(ch=>{
      const k=K(ch.coll,ch.id),local=db[ch.coll].find(x=>x.id===ch.id);
      if(local&&JSON.stringify(local)!==sent[k])return;
      if(ch.deleted){if(local||sent[k]){replaceLocal(ch.coll,ch.id,null);redraw=true}return}
      if((base[k]||0)>=ch.data._rev)return;
      replaceLocal(ch.coll,ch.id,ch.data);redraw=true;
    });
    Object.keys(c.docs||{}).forEach(k=>{const d=c.docs[k];if(base[k]>=d.rev||JSON.stringify(db[k])!==sent[k])return;db[k]=d.data;base[k]=d.rev;sent[k]=JSON.stringify(d.data);redraw=true});
    rev=Math.max(rev,c.rev);
    if(redraw&&!editing())render();
  }catch(e){online=false}
  pill();
}
function pill(){
  const p=$("#saved");if(!p||!me)return;
  let t,w=false;
  if(!online){t="Not saved yet, retrying";w=true}
  else if(syncing||pending().length)t="Saving…";
  else if(!status.dropbox)t=me.role==="admin"?"Saved (Dropbox not set up)":"Saved";
  else if(status.syncError){t="Dropbox problem";w=true}
  else if(status.dirty)t="Saved, going to Dropbox…";
  else t="In Dropbox ✓";
  p.textContent=t;p.classList.toggle("warn",w);
}
addEventListener("beforeunload",e=>{if(pending().length){flush();e.preventDefault();e.returnValue=""}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});

/* ---------- history (undo / redo) ---------- */
function snap(r){const c=clone(r);delete c.hist;delete c.pos;return c}
function track(r,label){
  r.hist=(r.hist||[]).slice(0,(r.pos??-1)+1);
  r.hist.push({at:Date.now(),label,by:me?me.name:"",data:snap(r)});
  if(r.hist.length>80)r.hist.shift();
  r.pos=r.hist.length-1;
}
function step(r,d){
  const n=r.pos+d;if(n<0||n>=r.hist.length)return;
  const {hist}=r,data=clone(r.hist[n].data);
  Object.keys(r).forEach(k=>delete r[k]);
  Object.assign(r,data,{hist,pos:n});
  save();render();toast(d<0?"Undone":"Redone");
}
function historyBox(r){
  return `<div class="row"><button class="btn sm" data-act="undo" ${r.pos<=0?"disabled":""}>↶ Undo</button><button class="btn sm" data-act="redo" ${r.pos>=r.hist.length-1?"disabled":""}>↷ Redo</button></div>
  <details class="card" style="margin-top:10px"><summary>Change history (${r.hist.length})</summary><table>${r.hist.map((h,i)=>`<tr><td>${esc(h.label)}${i===r.pos?" <b>← current</b>":""}${h.by?`<div class="mute">${esc(h.by)}</div>`:""}</td><td class="r mute">${when(h.at)}</td></tr>`).reverse().join("")}</table></details>`;
}

let route=location.hash.slice(2)||"dash", filter="open", search="", draft=null, draftKey="";

/* ---------- routing ---------- */
function go(r){if(r==="settings")admin=null;route=r;try{location.hash="/"+r}catch(e){}render();scrollTo(0,0)}
addEventListener("hashchange",()=>{const r=location.hash.slice(2)||"dash";if(r!==route){route=r;render()}});
function myLayout(){try{return localStorage.getItem("ao-layout")||"auto"}catch(e){return "auto"}}
function applyLayout(){
  let l=myLayout();
  if(l==="auto")l=innerWidth<700?"phone":innerWidth<1050?"tablet":"web";
  document.body.className=l;
}
addEventListener("resize",applyLayout);

/* ---------- views ---------- */
const badge=s=>`<span class="badge s${s}">${STATES[s]}</span>`;
function orderCard(o){
  const late=o.status<4&&o.due&&o.due<today();
  return `<button class="card tap" data-go="order/${o.id}">
  <div class="row between"><b>#${pad(o.number)} · ${esc(o.customer)}</b>${badge(o.status)}</div>
  <div class="mute">${esc(o.lines.map(l=>l.qty+"× "+l.name+(colText(l)?" ("+colText(l)+")":"")).join(", "))}</div>
  <div class="row between"><span class="${late?"warn":"mute"}">${o.due?(late?"Overdue: ":"Due ")+day(o.due):"No due date"}</span><span><b>${money(total(o))}</b>${unpriced(o)?' <span class="warn">+ to quote</span>':""} <span class="mute">${o.paid?"· Paid":"· Unpaid"}</span></span></div></button>`;
}
const byDue=(a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||a.number-b.number;
const views={
  dash(){
    const os=db.orders, open=os.filter(o=>o.status<4), sum=a=>a.reduce((t,o)=>t+cents(total(o)),0)/100;
    const month=today().slice(0,7);
    const shippedM=os.filter(o=>o.status===4&&o.stamps[4]&&today(new Date(o.stamps[4])).startsWith(month));
    return `<h1>Dashboard</h1>
    <div class="hero">${CRANE}<div><b>${open.length} open order${open.length===1?"":"s"}</b><span class="mute">Happy folding!</span></div></div>
    <button class="btn pri wide" data-go="new">＋ New order</button>
    <h2>Money</h2><div class="stats">
      ${[[money(sum(open)),"Value of open orders"],[money(sum(os.filter(o=>!o.paid))),"Waiting to be paid"],[money(sum(os.filter(o=>o.paid))),"Paid, all time"],[money(sum(shippedM)),"Shipped this month"]].map(([v,t])=>`<div class="card stat" style="margin:0"><b>${v}</b><span>${t}</span></div>`).join("")}
    </div>
    <h2>Workflow</h2><div class="card"><table>${STATES.map((s,i)=>`<tr><td><button class="btn sm wide" style="text-align:left" data-act="filter" data-v="${i}">${badge(i)}</button></td><td class="r"><b style="line-height:36px">${os.filter(o=>o.status===i).length}</b></td></tr>`).join("")}</table></div>
    <h2>Next due</h2><div class="grid">${open.sort(byDue).slice(0,4).map(orderCard).join("")||'<div class="card mute">No open orders.</div>'}</div>`;
  },
  orders(){
    return `<h1>Orders</h1>
    <div class="chips">${[["open","Open"],...STATES.map((s,i)=>[String(i),s]),["all","All"]].map(([v,t])=>`<button class="${filter===v?"on":""}" data-act="filter" data-v="${v}">${t}</button>`).join("")}</div>
    <input id="search" type="search" placeholder="Search name, number or item" value="${esc(search)}" style="margin-bottom:10px">
    <div class="grid" id="list">${orderList()}</div>`;
  },
  order(id){
    const o=db.orders.find(x=>x.id===id); if(!o)return `<div class="card">Order not found.</div>`;
    return `<div class="row between"><h1>Order #${pad(o.number)}</h1>${badge(o.status)}</div>
    <div class="card"><div class="steps">${STATES.map((s,i)=>`<div class="step ${i<=o.status?"done":""} ${i===o.status?"now":""}"><i></i>${s}</div>`).join("")}</div>
    ${o.status<4?`<button class="btn pri wide" data-act="advance" ${o.status===2&&left(o)?"disabled":""}>${NEXT[o.status]} →</button>${o.status===2&&left(o)?`<div class="warn" style="margin-top:8px;text-align:center">Check off ${left(o)} more item${left(o)===1?"":"s"} first</div>`:""}`:`<div class="mute">Shipped ${o.stamps[4]?when(o.stamps[4]):""}${o.tracking?" · Tracking: "+esc(o.tracking):""}</div>`}
    ${o.status>0?`<button class="btn sm" style="margin-top:8px" data-act="back">← Move back to “${STATES[o.status-1]}”</button>`:""}</div>
    <div class="card"><b>${esc(o.customer)}</b><div class="mute">${esc(o.contact)}</div><div style="white-space:pre-wrap">${esc(o.address)}</div><div class="mute">${o.due?"Due "+day(o.due):"No due date"}</div></div>
    ${o.status===2?checklist(o):""}
    <div class="card"><table>${o.status===2?"":o.lines.map((l,i)=>`<tr><td>${l.qty}× ${esc(l.name)}${l.pid?"":' <span class="badge s0">Custom</span>'}${colours(l)}<div class="mute">${esc(l.desc)}</div></td><td class="r">${l.price===""?`<button class="btn sm pri" data-act="addprice" data-v="${i}">Add price</button>`:money(lineTotal(l))}</td></tr>`).join("")}

  <h2>Items to make</h2>${o.lines.map(l=>box(l.id,`<b>${esc(l.qty)}× ${esc(l.name)}</b>${colours(l)}${l.desc?`<div class="mute">${esc(l.desc)}</div>`:""}`)).join("")}
  <h2>Envelope</h2>${PACK.map(([k,t])=>{const extra=k==="env"?o.address||"No address on this order yet":k==="ret"?ret||"Add your return address in Settings":"";return box(k,esc(t)+(extra?`<div class="mute" style="white-space:pre-wrap">${esc(extra)}</div>`:""))}).join("")}</div>`;
}

function render(){

/* ---------- dialogs ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2600)}
function ask(html,okText,onOk){
  const d=$("#dlg");
  d.innerHTML=html+`<div class="row" style="margin-top:12px"><button class="btn pri" id="dok">${okText}</button><button class="btn" id="dno">Cancel</button></div>`;
  $("#dno").onclick=()=>d.close();
  $("#dok").onclick=()=>{if(onOk()!==false)d.close()};
  d.showModal();
}
function copy(text){
  const manual=()=>ask(`<b>Select all and copy</b><textarea style="min-height:200px">${esc(text)}</textarea>`,"Done",()=>{});
  navigator.clipboard?navigator.clipboard.writeText(text).then(()=>toast("Copied"),manual):manual();
}
function download(name,text){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
const notesText=list=>list.map(n=>`[${n.type}] ${n.text}\n  Screen: ${n.screen} · ${when(n.at)} · ${n.device}`).join("\n\n");

/* ---------- actions ---------- */
const current=()=>{const [v,id]=route.split("/");return (v==="product"?db.products:db.orders).find(x=>x.id===id)};
function change(o,label,fn){fn();track(o,label);save();render()}
const acts={
  note(){
    const screen="#/"+route.split("/")[0];
    ask(`<b>New note</b><label>Type</label><select id="ntype"><option>Idea</option><option>Bug</option><option>Change</option></select><label>Your note</label><textarea id="ntext"></textarea>`,"Save note",()=>{
      const text=$("#ntext").value.trim();if(!text){toast("Type your note first");return false}
      const ua=navigator.userAgent, device=/Android/i.test(ua)?"Android":/Windows/i.test(ua)?"Windows":"Other";
      db.notes.push({id:uid(),type:$("#ntype").value,text,screen,at:Date.now(),device,done:false});save();toast("Note saved");
      if(route==="notes"||route==="settings")render();
    });
  },
  filter(v){filter=v;route==="orders"?render():go("orders")},
  undo(){step(current(),-1)}, redo(){step(current(),1)},
  advance(){
    const o=current(), n=o.status+1;
    const run=(extra="")=>change(o,"Moved to "+STATES[n],()=>{o.status=n;o.stamps[n]=Date.now();if(extra)o.tracking=extra});
    if(n===1&&unpriced(o))return toast("Add a price to every custom item before accepting (Edit order).");
    if(o.status===2&&left(o))return toast("Finish the checklist first.");
    if(n===4)return ask(`<b>Mark as shipped?</b>${o.paid?"":'<div class="warn">This order is not marked as paid.</div>'}<label>Tracking number (optional)</label><input id="trk" value="${esc(o.tracking)}">`,"Mark shipped",()=>run($("#trk").value.trim()));
    run();
  },
  back(){const o=current();change(o,"Moved back to "+STATES[o.status-1],()=>{delete o.stamps[o.status];o.status--})},
  copyorder(){const o=current();copy(`Order #${pad(o.number)} for ${o.customer}\n`+o.lines.map(l=>`${l.qty} x ${l.name}${colText(l)?" - "+colText(l):""}${l.desc?" ("+l.desc+")":""} - ${l.price===""?"to be quoted":money(lineTotal(l))}`).join("\n")+`\n${shipLabel(o)}: ${money(o.shipping)}\nTotal: ${money(total(o))}`)},
  delorder(){const o=current();ask(`<b>Delete order #${pad(o.number)}?</b><div class="mute">This can’t be undone.</div>`,"Delete",()=>{db.orders=db.orders.filter(x=>x!==o);go("orders")})},
  addprice(i){
    const o=current(), l=o.lines[+i];
    ask(`<b>Price for ${esc(l.name)}</b><div class="mute">Quantity: ${esc(l.qty)}</div><label>Price each ($)</label><input id="quote" type="number" min="0" step="0.01" inputmode="decimal">`,"Save price",()=>{
      const v=$("#quote").value.trim();if(v===""||!(+v>=0)){toast("Enter a price of 0 or more.");return false}
      change(o,"Price added: "+l.name+" "+money(v),()=>o.lines[+i].price=Math.round(+v*100)/100);toast("Price added");
    });
    $("#quote").focus();
  },
  togglecol(i,el){const l=draft.lines[+i],n=el.dataset.col,k=l.colours.indexOf(n);k<0?l.colours.push(n):l.colours.splice(k,1);render()},
  addcol(){db.colours.push({id:uid(),name:"",hex:"#cccccc"});render();const x=document.querySelectorAll("[data-col][data-k=name]");x[x.length-1].focus()},
  rmcolphoto(i){delete db.colours[+i].img;render()},
  rmcol(i){db.colours.splice(+i,1);render()},
  addrate(){db.settings.rates.push({id:uid(),name:"",price:0});render()},
  rmrate(i){db.settings.rates.splice(+i,1);render()},
  addcustom(){draft.lines.push({id:uid(),pid:"",name:"",desc:"",price:"",qty:1,colours:[]});render()},
  rmline(i){draft.lines.splice(+i,1);render()},
  toproducts(i){
    const l=draft.lines[+i];if(!l.name.trim()||l.price==="")return toast("Give it a name and a price first.");
    const p={id:uid(),name:l.name.trim(),desc:l.desc,price:+l.price,active:true,photo:""};track(p,"Added from an order");db.products.push(p);l.pid=p.id;l.name=p.name;save();render();toast("Added to product list");
  },
  saveorder(){
    const d=draft;
    if(!d.customer.trim())return toast("Add the customer’s name.");
    if(!d.lines.length)return toast("Add at least one item.");
    if(d.lines.some(l=>!l.name.trim()))return toast("Every custom item needs a name.");
    if(d.lines.some(l=>!Number.isInteger(+l.qty)||+l.qty<1))return toast("Quantity must be a whole number, 1 or more.");
    if(d.lines.some(l=>+l.price<0)||+d.shipping<0)return toast("Prices can’t be negative.");
    const id=route.split("/")[1];let o=db.orders.find(x=>x.id===id);
    if(o){
      if(o.status>0&&unpriced(d))return toast("An accepted order needs a price on every item.");
      const next=clone(d), sig=l=>JSON.stringify([l.name,l.desc,String(l.qty),l.colours]);
      next.lines.forEach(l=>{const old=o.lines.find(x=>x.id===l.id);if(!old||sig(old)!==sig(l))delete next.checks[l.id]});
      if(next.address!==o.address)delete next.checks.env;
      Object.keys(next.checks).forEach(k=>{if(!checkKeys(next).includes(k))delete next.checks[k]});
      const reopen=next.status===3&&left(next)>0;
      if(reopen){next.status=2;delete next.stamps[3]}
      Object.assign(o,next,{hist:o.hist,pos:o.pos});track(o,reopen?"Edited, moved back to In production":"Edited");
      if(reopen){go("order/"+o.id);return toast("Saved. Back in production: check off the changed items.")}
    }else{
      o={...clone(d),id:uid(),number:0,status:0,created:Date.now(),stamps:{0:Date.now()}};track(o,"Order created");db.orders.push(o);
    }
    go("order/"+o.id);toast("Saved");
  },
  rmphoto(){draft.photo="";render()},
  saveproduct(){
    if(!draft.name.trim())return toast("Add a product name.");
    if(draft.price===""||+draft.price<0)return toast("Add a price of 0 or more.");
    draft.price=+draft.price;
    let p=db.products.find(x=>x.id===draft.id);
    if(p){Object.assign(p,clone(draft));track(p,"Edited")}else{p=clone(draft);track(p,"Added");db.products.push(p)}
    go("products");toast("Saved");
  },
  delproduct(){const p=current();ask(`<b>Delete “${esc(p.name)}”?</b><div class="mute">Existing orders keep the item and its price.</div>`,"Delete",()=>{db.products=db.products.filter(x=>x!==p);go("products")})},
  togglenote(id){const n=db.notes.find(x=>x.id===id);n.done=!n.done;render()},
  delnote(id){ask("<b>Delete this note?</b>","Delete",()=>{db.notes=db.notes.filter(x=>x.id!==id);render()})},
  copynotes(){const l=db.notes.filter(n=>!n.done);l.length?copy(notesText(l)):toast("No open notes")},
  dlnotes(){download("improvement-notes.txt",notesText(db.notes))},
  export(){location.href="/api/admin/backup"},
  import(){$("#importfile").click()},
  dismiss(){api("/api/admin/dismiss",{}).then(()=>{status.justUpdated=null;status.failed=null;render()})},
  logout(){api("/api/logout",{}).finally(()=>location.reload())},
  changepw(){
    ask(`<b>Change my password</b><label>Current password</label><input id="pwold" type="password" autocomplete="current-password"><label>New password (8 or more characters)</label><input id="pwnew" type="password" autocomplete="new-password">`,"Change",()=>{
      api("/api/password",{old:$("#pwold").value,new:$("#pwnew").value}).then(()=>{$("#dlg").close();toast("Password changed. Other devices are logged out.")},e=>toast(e.message));return false});
  },
  adduser(){
    ask(`<b>Add a user</b><label>Their name</label><input id="uname"><label>Username (for logging in)</label><input id="uuser" autocapitalize="none" autocomplete="off"><label>Starting password (8 or more characters)</label><input id="upw" autocomplete="off"><label>Role</label><select id="urole"><option value="user">User (everything except Settings)</option><option value="admin">Admin</option></select><div class="mute" style="margin-top:6px">Give them the password in person; they can change it under Account.</div>`,"Add user",()=>{
      adminCall("/api/admin/users",{action:"add",name:$("#uname").value,username:$("#uuser").value,password:$("#upw").value,role:$("#urole").value},"User added",true);return false});
  },
  resetpw(u){ask(`<b>New password for ${esc(u)}</b><label>New password (8 or more characters)</label><input id="upw" autocomplete="off"><div class="mute" style="margin-top:6px">They’ll be logged out everywhere.</div>`,"Set password",()=>{adminCall("/api/admin/users",{action:"reset",username:u,password:$("#upw").value},"Password set",true);return false})},
  rmuser(u){ask(`<b>Remove ${esc(u)}?</b><div class="mute">They won’t be able to log in. Orders they made stay.</div>`,"Remove",()=>{adminCall("/api/admin/users",{action:"remove",username:u},"Removed")})},
  savegh(){adminCall("/api/admin/github",{repo:$("#ghrepo").value,token:$("#ghtoken").value},null)},
  checknow(){toast("Checking…");api("/api/admin/check",{}).then(r=>{admin=r.info;status.available=r.available;render();toast(r.available?"Version "+r.available+" is ready to install.":"You have the latest version.")},e=>toast(e.message))},
  installgh(){ask(`<b>Install the new version?</b><div class="mute">The app restarts for a few seconds. Your orders aren’t touched.</div>`,"Install",()=>{installing(api("/api/admin/install-github",{}))})},
  rollback(v){ask(`<b>Go back to version ${esc(v)}?</b><div class="mute">The app restarts for a few seconds. Your orders aren’t touched.</div>`,"Go back",()=>{installing(api("/api/admin/rollback",{version:v}))})},
  zipupdate(){$("#zipfile").click()},
  dbxupdates(){
    toast("Looking in Dropbox…");
    api("/api/admin/dropbox-updates",{}).then(r=>{
      if(!r.files.length)return toast("No .zip files in the “_App updates” folder yet.");
      ask(`<b>Install from Dropbox</b><label>Update file</label><select id="dbxzip">${r.files.map(n=>`<option>${esc(n)}</option>`).join("")}</select>`,"Install",()=>{installing(api("/api/admin/dropbox-updates",{name:$("#dbxzip").value}))});
    },e=>toast(e.message));
  },
  dbxstart(){
    const w=window.open("","_blank");
    api("/api/dropbox/start",{appKey:$("#dbxkey").value}).then(r=>{if(w)w.location=r.url;else location.href=r.url;toast("Allow access in Dropbox, then copy the code back here.")},e=>{if(w)w.close();toast(e.message)});
  },
  dbxfinish(){adminCall("/api/dropbox/finish",{code:$("#dbxcode").value},"Dropbox connected. Now choose a folder.")},
  dbxoff(){ask("<b>Disconnect Dropbox?</b><div class='mute'>Files already in Dropbox stay there.</div>","Disconnect",()=>{adminCall("/api/dropbox/disconnect",{},"Disconnected")})},
  syncnow(){toast("Syncing…");adminCall("/api/dropbox/sync",{},"Saved to Dropbox")},
  pickfolder(){folderPicker("")}
};
async function adminCall(path,body,msg,closeDlg){
  try{const r=await api(path,body);admin=r.info||r;if(closeDlg)$("#dlg").close();render();toast(msg||r.message||"Done")}catch(e){toast(e.message)}
}
function loadAdmin(){if(adminLoading)return;adminLoading=true;api("/api/admin/info").then(i=>{admin=i;adminLoading=false;if(route==="settings")render()},e=>{adminLoading=false;toast(e.message)})}
async function installing(p){
  toast("Installing…");
  try{const r=await p;$("#app").innerHTML=`<div class="card"><b>Installing version ${esc(r.installing)}…</b><div class="mute">The app is restarting. This page reloads by itself.</div></div>`;
    for(let i=0;i<40;i++){await new Promise(z=>setTimeout(z,1500));try{const h=await (await fetch("/healthz",{cache:"no-store"})).json();if(h.version===r.installing)return location.reload()}catch(e){}}
    location.reload();
  }catch(e){toast(e.message)}
}
async function folderPicker(path){
  let list;try{list=(await api("/api/dropbox/list",{path})).folders}catch(e){return toast(e.message)}
  const d=$("#dlg");
  d.innerHTML=`<b>Choose a Dropbox folder</b><div class="mute" style="margin:4px 0 8px">In: <b>${esc(path||"Dropbox (top level)")}</b></div>
  <div style="max-height:45vh;overflow:auto">${path?`<button class="btn sm wide" style="text-align:left;margin-bottom:4px" data-fp="${esc(path.replace(/\/[^\/]*$/,""))}">⬑ Up one level</button>`:""}${list.map(p=>`<button class="btn sm wide" style="text-align:left;margin-bottom:4px" data-fp="${esc(p)}">📁 ${esc(p.split("/").pop())}</button>`).join("")||'<div class="mute">No folders here.</div>'}</div>
  <div class="row" style="margin-top:10px"><input id="newfolder" placeholder="New folder name" style="flex:1"><button class="btn sm" id="mkfolder">Create</button></div>
  <div class="row" style="margin-top:10px">${path?`<button class="btn pri" id="usefolder">Use “${esc(path.split("/").pop())}”</button>`:""}<button class="btn" id="fpclose">Cancel</button></div>`;
  d.querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>folderPicker(b.dataset.fp));
  $("#fpclose").onclick=()=>d.close();
  $("#mkfolder").onclick=async()=>{const n=$("#newfolder").value.trim().replace(/[\/\\]/g,"-");if(!n)return toast("Type a folder name.");try{await api("/api/dropbox/mkdir",{path:path+"/"+n});folderPicker(path+"/"+n)}catch(e){toast(e.message)}};
  if(path)$("#usefolder").onclick=async()=>{try{admin=await api("/api/dropbox/folder",{path});d.close();render();toast("Folder set. Saving to Dropbox now.")}catch(e){toast(e.message)}};
  if(!d.open)d.showModal();
}


document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){const r=g.dataset.go;if(r==="new"||r.startsWith("edit/")||r.startsWith("product/")){draft=null;draftKey=""}return go(r)}
  const a=e.target.closest("[data-act]");
  if(a)acts[a.dataset.act](a.dataset.v,a);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="search"){search=t.value;$("#list").innerHTML=orderList();return}
  if(t.id==="sname"){db.settings.name=t.value;$("#brandname").textContent=t.value;return save()}
  if(t.id==="sclaude"){db.settings.claude=t.value;return save()}
  if(t.id==="sreturn"){db.settings.returnAddress=t.value;return save()}
  if(t.dataset.rate!==undefined){db.settings.rates[+t.dataset.rate][t.dataset.k]=t.dataset.k==="price"?Math.max(0,+t.value||0):t.value;return save()}
  if(t.dataset.col!==undefined&&t.dataset.k){const c=db.colours[+t.dataset.col];c[t.dataset.k]=t.dataset.k==="name"?t.value.replace(/\s+/g," ").trimStart():t.value;return save()}
  if(!draft)return;
  if(t.id==="shiprate"||t.dataset.check!==undefined)return;
  if(t.dataset.f)draft[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;
  if(t.dataset.l!==undefined)draft.lines[+t.dataset.l][t.dataset.k]=t.value;
  if(t.dataset.f==="shipping"){draft.shipName="";$("#shiprate").value=""}
  if($("#ftotal"))$("#ftotal").textContent=money(total(draft));
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.check!==undefined){
    const o=current(),k=t.dataset.check,l=o.lines.find(x=>x.id===k),name=l?l.name:PACK.find(p=>p[0]===k)[1];
    change(o,(t.checked?"Checked: ":"Unchecked: ")+name,()=>{t.checked?o.checks[k]=true:delete o.checks[k]});
  }
  if(t.id==="shiprate"){
    const r=db.settings.rates.find(r=>r.id===t.value);draft.shipName=r?r.name:"";if(r)draft.shipping=r.price;render();
  }
  if(t.id==="slayout"){try{localStorage.setItem("ao-layout",t.value)}catch(e){}render()}
  if(t.dataset.role){adminCall("/api/admin/users",{action:"role",username:t.dataset.role,role:t.value},"Role changed")}
  if(t.id==="zipfile"&&t.files[0]){const file=t.files[0];ask(`<b>Install ${esc(file.name)}?</b><div class="mute">The app restarts for a few seconds. Your orders aren’t touched.</div>`,"Install",()=>{installing(file.arrayBuffer().then(b=>api("/api/admin/install-zip",b,true)))})}
  if(t.id==="paid"){const o=current();change(o,t.checked?"Marked paid":"Marked unpaid",()=>o.paid=t.checked)}
  if(t.id==="addprod"&&t.value){const p=db.products.find(x=>x.id===t.value);draft.lines.push({id:uid(),pid:p.id,name:p.name,desc:"",price:p.price,qty:1,colours:[]});render()}
  if(t.dataset.colphoto!==undefined&&t.files[0]){
    const c=db.colours[+t.dataset.colphoto], img=new Image(), url=URL.createObjectURL(t.files[0]);
    img.onload=()=>{const s=Math.min(img.width,img.height),cv=document.createElement("canvas");cv.width=cv.height=160;
      cv.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);c.img=cv.toDataURL("image/jpeg",.8);URL.revokeObjectURL(url);render();toast("Paper photo added")};
    img.onerror=()=>toast("That file isn’t a photo this browser can open.");
    img.src=url;
  }
  if(t.id==="photo"&&t.files[0]){
    const target=draft, img=new Image(), url=URL.createObjectURL(t.files[0]);
    img.onload=()=>{const k=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);target.photo=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(url);if(draft===target)render()};
    img.onerror=()=>toast("That file isn’t a photo this browser can open.");
    img.src=url;
  }
  if(t.id==="importfile"&&t.files[0])t.files[0].text().then(s=>{
    let n;try{n=JSON.parse(s);if(n.app!=="ashtonsorigami")throw 0}catch(e){return toast("That isn’t a backup from this app.")}
    ask(`<b>Replace everything with this backup?</b><div class="mute">${n.orders.length} orders, ${n.products.length} products. Everything in the app now is replaced, for everyone.</div>`,"Restore",()=>{
      api("/api/admin/restore",n).then(()=>api("/api/data")).then(d=>{loadAll(d);go("dash");toast("Restored")},e=>toast(e.message))});
  });

});

/* ---------- start ---------- */
function authScreen(html){document.body.className="phone";$("#nav").innerHTML="";$("#saved").textContent="";document.querySelector("header .btn").style.display="none";$("#app").innerHTML=html}
function showSetup(){
  authScreen(`<div class="hero">${CRANE}<div><b>Welcome!</b><span class="mute">Create the first admin account.</span></div></div>
  <form class="card" id="authform"><label>Your name</label><input id="aname" value="Nadia"><label>Username</label><input id="auser" value="nadia" autocapitalize="none" autocomplete="username">
  <label>Password (8 or more characters)</label><input id="apw" type="password" autocomplete="new-password"><label>Type the password again</label><input id="apw2" type="password" autocomplete="new-password">
  <button class="btn pri wide" style="margin-top:12px">Create account</button></form>`);
  $("#authform").onsubmit=async e=>{e.preventDefault();if($("#apw").value!==$("#apw2").value)return toast("The two passwords don’t match.");
    try{await api("/api/setup",{name:$("#aname").value,username:$("#auser").value,password:$("#apw").value});location.reload()}catch(x){toast(x.message)}};
}
function showLogin(name){
  authScreen(`<div class="hero">${CRANE}<div><b>${esc(name||"Ashton's Origami")}</b><span class="mute">Please log in.</span></div></div>
  <form class="card" id="authform"><label>Username</label><input id="auser" autocapitalize="none" autocomplete="username"><label>Password</label><input id="apw" type="password" autocomplete="current-password">
  <button class="btn pri wide" style="margin-top:12px">Log in</button></form>`);
  $("#authform").onsubmit=async e=>{e.preventDefault();try{await api("/api/login",{username:$("#auser").value,password:$("#apw").value});location.reload()}catch(x){toast(x.message)}};
}
async function boot(){
  try{
    const m=await api("/api/me");
    $("#brandname").textContent=m.appName||"Ashton's Origami";
    if(m.setup)return showSetup();
    if(!m.user)return showLogin(m.appName);
    me=m.user;const d=await api("/api/data");loadAll(d);status=d.status;version=d.version;
    render();setInterval(poll,15000);
  }catch(e){$("#app").innerHTML=`<div class="card"><b>Can’t reach the app right now.</b><div class="mute">${esc(e.message)}</div><button class="btn" onclick="location.reload()">Try again</button></div>`}
}
boot();
</script>
